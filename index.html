<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Portfolio i Blog</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        header {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #111;
        }
        section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 10px;
        }
        .date {
            color: #666;
            font-size: 0.9rem;
        }
        /* Styl dla uciekającego guzika (easter egg) */
        .easter-egg-container {
            position: relative;
            height: 100px;
            margin-top: 20px;
            border: 1px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #uciekajacy-guzik {
            padding: 10px 20px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            position: absolute;
            transition: top 0.1s ease, left 0.1s ease;
        }
    </style>
</head>
<body>

    <header>
        <h1>Witaj na mojej stronie!</h1>
        <p>Portfolio oraz blog tworzony w czystym kodzie na GitHub Pages.</p>
    </header>

    <section>
        <h2>Aktualności i Wpisy</h2>
        <ul>
            <!-- TUTAJ DODAJESZ NOWE WPISY NA SAMEJ GÓRZE -->
            <li><span class="date">11.08.2026</span> - <a href="projekt-1.html">Mój pierwszy projekt w portfolio</a></li>
        </ul>
    </section>

    <section>
        <h2>Easter Egg (Uciekający przycisk)</h2>
        <p>Spróbuj kliknąć lub najechać na przycisk poniżej:</p>
        <div class="easter-egg-container" id="kontener">
            <button id="uciekajacy-guzik">Złap mnie!</button>
        </div>
    </section>

    <script>
        const uciekajacyGuzik = document.getElementById('uciekajacy-guzik');
        const kontener = document.getElementById('kontener');

        function ucieczka() {
            // Obliczamy losową pozycję wewnątrz kontenera
            const maxX = kontener.clientWidth - uciekajacyGuzik.clientWidth;
            const maxY = kontener.clientHeight - uciekajacyGuzik.clientHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            uciekajacyGuzik.style.left = randomX + 'px';
            uciekajacyGuzik.style.top = randomY + 'px';
        }

        // Działanie na komputerze (najechanie myszką)
        uciekajacyGuzik.addEventListener('mouseover', ucieczka);

        // Działanie na telefonie (dotknięcie palcem lub kliknięcie)
        uciekajacyGuzik.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Zapobiega standardowemu kliknięciu, ucieka od razu
            ucieczka();
        });

        uciekajacyGuzik.addEventListener('click', function(e) {
            e.preventDefault();
            ucieczka();
        });
    </script>

</body>
</html>
