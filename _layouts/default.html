<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} // breakcode</title>
    <link rel="icon" type="image/png" href="/ksiezyc.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        .system-bar {
            display: flex; gap: 20px; flex-wrap: wrap; background: rgba(8, 9, 17, 0.8);
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.1));
            padding: 10px 18px; border-radius: 8px; margin-bottom: 25px;
            font-family: monospace; font-size: 0.85rem; color: var(--text-muted, #94a3b8);
        }
        .main-container { max-width: 900px; margin: 0 auto; padding: 20px; }
    </style>
</head>
<body>

    <div class="fog-container"><div class="fog-layer"></div><div class="fog-layer-2"></div></div>

    <div class="container main-container" style="position: relative; z-index: 1;">
        <!-- PEŁNA NAWIGACJA -->
        <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
            <a href="/" style="text-decoration: none; color: inherit;">
                <div class="logo" style="display: flex; align-items: center; gap: 10px;">
                    <img src="/ksiezyc.png" alt="Księżyc" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;" onerror="this.style.display='none'">
                    <div>breakcode</div>
                </div>
            </a>
            <nav id="mainNav">
                <a href="/">✦ Strona główna</a>
                <a href="/blog.html">✦ Blog</a>
                <a href="/masz-pomysl.html">✦ Masz pomysł?</a>
                <a href="/laboratorium.html">✦ Laboratorium</a>
                <a href="/o-mnie.html">✦ O mnie</a>
                <a href="/portfolio.html">✦ Portfolio</a>
                <a href="/kontakt.html">✦ Kontakt</a>
                <a href="/admin.html">✦ Admin</a>
            </nav>
        </header>

        <!-- PASEK CZASU -->
        <div class="system-bar">
            <div>CZAS SESJI: <span id="globalSessionTimer" style="color: var(--accent-moon, #38bdf8); font-weight: 700;">00:00</span></div>
            <div>GODZINA: <span id="globalClockTime" style="color: var(--accent-moon, #38bdf8); font-weight: 700;">00:00:00</span></div>
            <div>STATUS: <span style="color: #4ade80; font-weight: 700;">● SYSTEM AKTYWNY</span></div>
        </div>

        <!-- TREŚĆ DYNAMICZNA -->
        <main>
            {{ content }}
        </main>

        <!-- STOPKA -->
        <footer style="margin-top: 60px; border-top: 1px solid var(--border-color, rgba(255,255,255,0.1)); padding: 25px 0; text-align: center;">
            <div style="font-family: monospace; font-size: 0.85rem; color: var(--text-muted);">
                © Katarzyna Cherek // breakcode. Wszelkie prawa zastrzeżone.
            </div>
        </footer>
    </div>

    <!-- SKRYPT CZASU -->
    <script>
        (function() {
            let secondsSpent = parseInt(sessionStorage.getItem('breakcode_session_time')) || 0;
            setInterval(() => {
                secondsSpent++;
                sessionStorage.setItem('breakcode_session_time', secondsSpent);
                const mins = Math.floor(secondsSpent / 60).toString().padStart(2, '0');
                const secs = (secondsSpent % 60).toString().padStart(2, '0');
                document.getElementById('globalSessionTimer').innerText = `${mins}:${secs}`;
                document.getElementById('globalClockTime').innerText = new Date().toLocaleTimeString('pl-PL');
            }, 1000);
        })();
    </script>
</body>
</html>
